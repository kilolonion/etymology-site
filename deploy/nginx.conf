# /etc/nginx/conf.d/etymology.conf —— 把 words.example.com 换成你的域名
# 前端：nginx 直接托管 frontend/ 里的静态文件；后端：/api 转发给 127.0.0.1:8787
server {
    listen 80;
    server_name words.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name words.example.com;

    ssl_certificate     /etc/letsencrypt/live/words.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/words.example.com/privkey.pem;

    root /opt/etymology-site/frontend;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 字体和图标很少变，缓存 30 天
    location ~ ^/(fonts|icons)/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # 页面、脚本、样式、Service Worker：每次向服务器校验，更新后立刻生效
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        try_files $uri $uri/ /index.html;
    }
}
