       这里把公共模块直接并行预取。href 会被部署脚本统一打上同一个 ?v=，要和 import 里的地址一致 -->

  <link rel="modulepreload" href="/js/views/paper.js?v=212dd6fbae">

<body>
  <div class="chrome">

      <span class="brand-text">词源一日</span>
    </a>
  </header>
  <nav class="tabs" aria-label="主导航">
    <a href="#/" data-tab="today">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>

    <a href="#/explore" data-tab="explore">

      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20.5c1.2-3.8 4.2-5.6 7.5-5.6s6.3 1.8 7.5 5.6"/></svg>

  </div>
  <main id="app" tabindex="-1" aria-busy="true"><div class="boot" role="status" data-boot><span class="seal"></span><p>词源一日 · 正在打开…</p></div></main>
  <!-- 启动占位按地址先摆好版式：首页、日报直接画出和真报头同一套结构的报头（和 lib.js 的 mastSkeleton 保持一致），
       并提前挂上 home / bleed，免得脚本接手时顶栏先出现再消失、报头从别处跳过来 -->
  <script>
    (function () {
      var path = location.hash.replace(/^#\/?/, "").split("?")[0];
      var body = document.body.classList;
      var masts = { "": ["词源一日", "A Word &amp; Its Story, Every Day"], paper: ["词源日报", "The Etymon Daily, Twelve Stories a Day"] };
      var m = masts[path];
      if (path.indexOf("w/") === 0) body.add("bleed");
      if (!m) return;
      body.add("home");
      document.getElementById("app").innerHTML =
        '<div class="view sk-view" data-boot aria-hidden="true"><header class="mast">' +
        '<div class="mast-meta"><span class="no"><i class="sk-t" style="width:7.2em"></i></span><span class="date"><i class="sk-t" style="width:12em"></i></span></div>' +
        '<h1 class="mast-title"><span class="seal"></span>' + m[0] + '</h1><p class="mast-sub">' + m[1] + '</p><div class="mast-rule"></div></header></div>';
    })();
  </script>
  <noscript><p style="padding:24px;text-align:center">需要开启 JavaScript 才能使用。</p></noscript>
  <script type="module" src="/js/main.js?v=212dd6fbae"></script>
